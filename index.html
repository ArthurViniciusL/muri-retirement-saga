<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1C1410" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="A Aposentadoria de Muri — jogo de plataforma 2D dos 50 anos de Muricarliton."
    />
    <title>A Aposentadoria de Muri</title>

    <style>
      /* Paleta Cordel Arcade — mesmos valores de src/config/palette.ts. */
      :root {
        --bone: #f4eedd;
        --sertao: #6b4226;
        --ink: #1c1410;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bone);
        color: var(--ink);
        font-family: ui-monospace, "Courier New", monospace;
        /* Jogo touch: sem seleção, sem zoom por duplo toque, sem pull-to-refresh. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-root canvas {
        /* Pixel art: ampliação sem suavização — Guia de Estilo §3 e §4. */
        image-rendering: pixelated;
        display: block;
      }

      /* Aviso de orientação — System Design §14: landscape obrigatório.
         Mesma linguagem da tela inicial: papel claro, entalhe preto, sombra por
         hachura. Cantos assimétricos imitam o corte da goiva (guidelines.md §13). */
      #orientation-gate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: var(--bone);
        color: var(--ink);
      }

      #orientation-gate[data-visible="true"] {
        display: flex;
      }

      #orientation-gate[data-visible="true"] ~ #game-root {
        visibility: hidden;
      }

      .orientation-gate__phone {
        width: 7rem;
        height: 7rem;
      }

      .orientation-gate__device {
        transform-box: fill-box;
        transform-origin: center;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }

      .orientation-gate__title {
        margin: 0;
        padding: 0.5rem 1.25rem 0.625rem;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--bone);
        background: var(--ink);
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      }

      .orientation-gate__text {
        margin: 0;
        max-width: 26ch;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--ink);
      }

      @keyframes rotate-hint {
        0%,
        35% {
          transform: rotate(0deg);
        }
        65%,
        100% {
          transform: rotate(-90deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orientation-gate__device {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="orientation-gate" role="alertdialog" aria-live="polite" data-visible="false">
      <svg
        class="orientation-gate__phone"
        viewBox="0 0 96 96"
        aria-hidden="true"
        focusable="false"
      >
        <!-- Sombra por hachura a 45° sobre o papel, fixa: é o lugar onde o aparelho deita. -->
        <g stroke="var(--sertao)" stroke-width="2" stroke-linecap="round">
          <path d="M18 78 L30 66" />
          <path d="M26 80 L42 64" />
          <path d="M36 80 L52 64" />
          <path d="M46 80 L62 64" />
          <path d="M56 80 L72 64" />
          <path d="M66 80 L80 66" />
        </g>
        <g class="orientation-gate__device">
          <!-- Corpo entalhado: lados com barriga e um canto que passa do ponto. -->
          <path
            fill="var(--ink)"
            d="M31 13 C40 11.6 52 12 64.6 12.8 C65.8 30 66.4 52 65.4 83.2 C54 84.6 42 84.2 31.2 83.4 C29.8 64 30 36 30.4 14.6 L28.6 12.2 Z"
          />
          <!-- Tela em papel. -->
          <path
            fill="var(--bone)"
            d="M36 21 C44 20.2 52 20.4 59.6 21.2 C60.2 38 60.4 56 59.8 72.4 C52 73 44 72.8 36.2 72.2 C35.6 56 35.6 38 36 21 Z"
          />
          <!-- Goivadas na massa preta (guidelines.md §15). -->
          <path fill="var(--bone)" d="M33 30 C33.9 33 34 37 33 40 C32.3 37 32.3 33 33 30 Z" />
          <path fill="var(--bone)" d="M62.6 50 C63.4 53 63.4 57 62.7 60 C62 57 62 53 62.6 50 Z" />
          <path fill="var(--bone)" d="M42 16.2 C45 15.5 49 15.6 52 16.4 C49 17.1 45 17 42 16.2 Z" />
          <!-- Botão do aparelho. -->
          <path fill="var(--bone)" d="M45.6 77.4 C47.4 76.8 49.4 76.9 50.8 77.6 C49.4 79.4 47 79.4 45.6 77.4 Z" />
        </g>
      </svg>
      <h1 class="orientation-gate__title">Gire o celular</h1>
      <p class="orientation-gate__text">
        A Aposentadoria de Muri só roda na horizontal. Deite o aparelho para começar.
      </p>
    </div>

    <div id="game-root"></div>

    <script>
      // Checagem de orientação — System Design §14.
      // O lock real via Screen Orientation API só funciona em fullscreen no Chrome
      // mobile, então a estratégia é detectar portrait e bloquear com este aviso.
      (function () {
        var gate = document.getElementById('orientation-gate');

        function isPortrait() {
          // A proporção do viewport é o que de fato decide se cabe um jogo
          // side-scrolling, então ela manda. A Screen Orientation API entra só como
          // reforço: em alguns contextos (emulação de dispositivo, webviews) ela
          // reporta um valor defasado que não corresponde ao viewport real.
          if (window.innerHeight > window.innerWidth) {
            return true;
          }
          var orientation = window.screen && window.screen.orientation;
          if (orientation && typeof orientation.type === 'string') {
            return orientation.type.indexOf('portrait') === 0;
          }
          return false;
        }

        function sync() {
          gate.setAttribute('data-visible', isPortrait() ? 'true' : 'false');
        }

        window.addEventListener('resize', sync);
        // Em orientationchange as dimensões podem chegar defasadas um frame.
        window.addEventListener('orientationchange', function () {
          sync();
          window.requestAnimationFrame(sync);
        });
        sync();
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
